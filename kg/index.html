<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="description" content="비밀번호로 보호된 페이지입니다.">
<title>잠긴 지식그래프</title>
<style>
  :root{
    --bg:#f5f8fc; --ink:#0f172a; --sub:#55657d; --mute:#8a99b0; --line:#e2e9f4; --card:#ffffff;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --sh:0 1px 2px rgba(16,24,40,.06), 0 10px 30px rgba(16,24,40,.08);
    --c-person:#4f7cf7; --c-project:#10b981; --c-webapp:#8b5cf6;
    --c-document:#f59e0b; --c-event:#ec4899; --c-place:#0ea5e9;
    --hdr:64px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
    height:100dvh; overflow:hidden; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit}

  /* ── 앱 바로가기 (상단 고정 교차 내비게이션) ───────── */
  .xnav{
    flex:0 0 auto;position:relative;z-index:7;
    background:#f7f9fe;border-bottom:1px solid var(--line);
  }
  .xnav-in{
    max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:2px;
    padding:4px 10px;overflow:hidden;
  }
  .xnav-item{
    flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;
    padding:5px 6px;border-radius:7px;font-size:11.5px;font-weight:650;letter-spacing:-.1px;
    color:var(--sub);text-decoration:none;white-space:nowrap;
    transition:background .16s,color .16s;
  }
  .xnav-item .em{font-size:12px;line-height:1;flex:none}
  .xnav-item:hover{background:#eef2ff;color:var(--ink)}
  .xnav-item[aria-current="page"]{background:#e9edff;color:#4338ca;font-weight:800;box-shadow:inset 0 0 0 1px #d8dffb}
  .xnav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  @media (max-width:430px){
    .xnav-in{padding:3px 4px;gap:0}
    .xnav-item{font-size:10px;gap:2px;padding:5px 1px;letter-spacing:-.45px}
    .xnav-item .em{font-size:10px}
  }
  @media (max-width:339px){ .xnav-item .em{display:none} .xnav-item{font-size:9.5px} }

  /* ── 머리말 ───────────────────────────────────────── */
  header#top{
    flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); z-index:6;
  }
  .brand{display:flex; align-items:center; gap:9px; min-width:0}
  .mark{
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(140deg,#4f46e5,#6366f1 45%,#8b5cf6); box-shadow:0 4px 12px rgba(79,70,229,.32);
    flex:0 0 auto;
  }
  .brand h1{font-size:16.5px;margin:0;letter-spacing:-.3px;font-weight:800;white-space:nowrap}
  .brand .stamp{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:1px;white-space:nowrap}

  .search{position:relative;flex:1 1 260px;max-width:340px;min-width:150px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
  .search input{
    width:100%;height:38px;border:1px solid var(--line);border-radius:11px;background:#f8fafd;
    padding:0 34px 0 34px;font-size:13.5px;color:var(--ink);outline:none;transition:.16s;
  }
  .search input:focus{border-color:#c7cdfb;background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .search input::placeholder{color:#a3b0c4}
  #searchClear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;
    background:transparent;color:var(--mute);border-radius:7px;cursor:pointer;display:none;font-size:15px;line-height:1;
  }
  #searchClear.on{display:block}
  #searchClear:hover{background:#eef2f8;color:var(--ink)}

  #stats{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .badge{
    display:inline-flex;align-items:baseline;gap:4px;padding:5px 9px;border-radius:9px;
    background:#f2f6fc;border:1px solid var(--line);color:var(--sub);font-size:11.5px;font-weight:600;white-space:nowrap;
  }
  .badge b{color:var(--ink);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}

  /* ── 필터 칩 ─────────────────────────────────────── */
  nav#chips{
    flex:0 0 auto;display:flex;gap:7px;padding:9px 16px;overflow-x:auto;overflow-y:hidden;
    background:rgba(255,255,255,.78);border-bottom:1px solid var(--line);scrollbar-width:none;z-index:5;
  }
  nav#chips::-webkit-scrollbar{display:none}
  .chip{
    display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;height:31px;padding:0 12px;
    border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--sub);
    font-size:12.5px;font-weight:650;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .chip:hover{border-color:#cbd6e6;color:var(--ink);transform:translateY(-1px)}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
  .chip .n{font-size:11px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{
    background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(15,23,42,.18)
  }
  .chip[aria-pressed="true"] .n{color:rgba(255,255,255,.7)}

  /* ── 무대 ────────────────────────────────────────── */
  main#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;overflow:clip}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas#cv.grabbing{cursor:grabbing}
  canvas#cv.onnode{cursor:pointer}

  #hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(15,23,42,.82);color:#fff;font-size:11.5px;font-weight:500;padding:6px 13px;border-radius:999px;
    pointer-events:none;opacity:1;transition:opacity .5s;white-space:nowrap;z-index:3;backdrop-filter:blur(4px)
  }
  #hint.off{opacity:0}

  #tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:4}
  #tools button{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.96);
    color:var(--sub);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);transition:.15s;
  }
  #tools button:hover{color:var(--accent);border-color:#cfd6fb;transform:translateY(-1px)}
  #tools button:active{transform:none}
  #zoomPct{
    position:absolute;left:14px;bottom:14px;font-size:11px;font-weight:700;color:var(--mute);
    background:rgba(255,255,255,.9);border:1px solid var(--line);padding:4px 9px;border-radius:8px;z-index:3;
    font-variant-numeric:tabular-nums;
  }

  #tooltip{
    position:absolute;z-index:7;pointer-events:none;padding:6px 10px;border-radius:9px;
    background:rgba(15,23,42,.92);color:#fff;font-size:11.5px;font-weight:600;max-width:260px;
    transform:translate(-50%,-140%);white-space:nowrap;opacity:0;transition:opacity .12s
  }
  #tooltip.on{opacity:1}

  /* ── 상세 패널 ───────────────────────────────────── */
  #panel{
    position:absolute;top:0;right:0;bottom:0;width:398px;max-width:92vw;background:var(--card);
    border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(16,24,40,.10);
    transform:translateX(103%);transition:transform .28s cubic-bezier(.22,.7,.2,1),visibility 0s .28s;
    display:flex;flex-direction:column;z-index:8;visibility:hidden;
  }
  #panel.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.22,.7,.2,1),visibility 0s 0s}
  .p-top{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative;flex:0 0 auto}
  .p-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .pill{font-size:10.5px;font-weight:750;padding:3px 8px;border-radius:7px;letter-spacing:.2px}
  .pill.cat{color:#fff}
  .pill.st{border:1px solid;background:#fff}
  #pClose{
    position:absolute;top:13px;right:13px;width:30px;height:30px;border:0;border-radius:9px;background:#f2f6fc;
    color:var(--sub);font-size:16px;cursor:pointer;display:grid;place-items:center;line-height:1
  }
  #pClose:hover{background:#e8eef8;color:var(--ink)}
  #pTitle{font-size:17px;font-weight:800;line-height:1.35;margin:0;letter-spacing:-.3px;padding-right:34px}
  #pMeta{font-size:11.5px;color:var(--mute);font-weight:600;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
  .p-body{overflow-y:auto;padding:16px 18px 26px;flex:1 1 auto;overscroll-behavior:contain}
  #pSummary{font-size:13.5px;line-height:1.72;color:#243349;margin:0;white-space:pre-wrap}
  #pTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tag{font-size:11px;font-weight:650;color:#455a78;background:#f1f5fb;border:1px solid #e4ebf6;padding:3px 8px;border-radius:7px}
  #pLink{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;font-weight:750;color:var(--accent);
    text-decoration:none;background:var(--accent-soft);padding:7px 11px;border-radius:9px;border:1px solid #dfe5ff;
    word-break:break-all
  }
  #pLink:hover{background:#e4e9ff}
  .sec{margin-top:22px}
  .sec h3{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:0 0 9px;font-weight:800}
  .rel-group{margin-bottom:13px}
  .rel-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .rel-name{font-size:11px;font-weight:800;color:#fff;background:#94a3b8;padding:2px 7px;border-radius:6px}
  .rel-cnt{font-size:10.5px;color:var(--mute);font-weight:700}
  .rel-item{
    display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fbfcfe;border-radius:10px;
    padding:8px 10px;margin-bottom:5px;cursor:pointer;transition:.13s;
  }
  .rel-item:hover{background:#f2f6fd;border-color:#cfd9ea;transform:translateX(1px)}
  .rel-item .lbl{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
  .rel-item .lbl .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .rel-item .note{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.45}
  .empty{font-size:12px;color:var(--mute)}

  #scrim{
    position:absolute;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:7;
  }
  body.sheet #scrim.on{opacity:1;pointer-events:auto}

  /* ── 잠금 화면 ───────────────────────────────────── */
  #lock{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;
    background:radial-gradient(1200px 700px at 50% -10%,#e8ecff 0%,#f5f8fc 55%,#eef3fb 100%)}
  body.locked #lock{display:grid}
  body.locked #top,body.locked #chips,body.locked #stage{display:none}
  body.locked .xnav{display:none !important}
  .lock-card{
    width:100%;max-width:372px;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:26px 24px 20px;box-shadow:0 18px 60px rgba(16,24,40,.14);text-align:center;
  }
  .lock-mark{
    width:52px;height:52px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(140deg,#4f46e5,#7c3aed);box-shadow:0 8px 22px rgba(79,70,229,.32);
  }
  .lock-card h1{font-size:18px;margin:0 0 6px;font-weight:800;letter-spacing:-.3px}
  .lock-sub{font-size:12.5px;color:var(--sub);margin:0 0 18px;line-height:1.6}
  .lock-field{position:relative;margin-bottom:10px}
  .lock-field input{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#f8fafd;
    padding:0 58px 0 14px;font-size:16px;outline:none;transition:.16s;letter-spacing:.02em
  }
  .lock-field input:focus{border-color:#c7cdfb;background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  #lockShow{position:absolute;right:7px;top:7px;height:32px;padding:0 10px;border:0;border-radius:8px;
    background:#eef2f8;color:var(--sub);font-size:11.5px;font-weight:700;cursor:pointer}
  #lockShow:hover{background:#e5ebf4;color:var(--ink)}
  .lock-err{min-height:16px;font-size:11.5px;color:#dc2626;font-weight:600;margin:2px 0 8px;text-align:left}
  .lock-remember{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sub);margin:0 0 12px;justify-content:center}
  .lock-remember input{accent-color:var(--accent);width:14px;height:14px}
  .lock-btn{
    width:100%;height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#6366f1);
    color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.28);transition:.15s
  }
  .lock-btn:hover{filter:brightness(1.05)}
  .lock-btn:disabled{opacity:.65;cursor:default;box-shadow:none}
  .lock-foot{font-size:10.5px;color:var(--mute);margin:14px 0 0;font-weight:600}
  .lock-shake{animation:shake .34s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}

  #toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:rgba(15,23,42,.92);color:#fff;
    font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:11px;opacity:0;pointer-events:none;
    transition:.25s;z-index:60;max-width:86vw;text-align:center
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ── 좁은 화면 ───────────────────────────────────── */
  @media (max-width:860px){
    header#top{flex-wrap:wrap;gap:7px 8px;padding:8px 12px}
    .brand{order:1;gap:7px}
    .brand .mark{width:30px;height:30px;border-radius:9px}
    .brand h1{font-size:14.5px}
    .brand .stamp{font-size:9.5px;margin-top:0;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #stampCov,#stampVer{display:none}
    #stats{order:2;margin-left:auto;gap:4px}
    .badge{padding:3px 6px;font-size:9.5px;gap:3px}
    .badge b{font-size:11px}
    .badge.upd{display:none}
    .search{order:3;flex:1 1 100%;max-width:none}
    .search input{height:34px;font-size:13px}
    nav#chips{padding:8px 12px;gap:6px}
    .chip{height:29px;font-size:12px;padding:0 10px}
    #tools{right:10px;bottom:10px;gap:6px}
    #tools button{width:36px;height:36px;border-radius:10px}
    #zoomPct{left:10px;bottom:10px}
    #hint{bottom:10px;font-size:10.5px;max-width:72vw;white-space:normal;text-align:center;line-height:1.35}
    #panel{
      top:auto;left:0;right:0;width:auto;max-width:none;height:auto;max-height:74dvh;
      border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
      transform:translateY(104%);box-shadow:0 -16px 44px rgba(16,24,40,.2);
    }
    #panel::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:4px;background:#e2e8f0}
    #panel.open{transform:none;visibility:visible}
    .p-top{padding:20px 16px 11px}
    #pTitle{font-size:16px}
    .p-body{padding:14px 16px 22px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body class="locked">
<!-- 잠금 화면: KG_LOCK이 있을 때만 body.locked로 보입니다 -->
<div id="lock" aria-hidden="true">
  <div class="lock-card" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5.4" r="2.4"/><circle cx="5.2" cy="16" r="2.2"/><circle cx="18.8" cy="16" r="2.2"/>
        <path d="M10.6 7.4 6.6 13.9M13.4 7.4l4 6.5M7.4 16h9.2"/>
      </svg>
    </div>
    <h1 id="lockTitle">지식그래프 잠금</h1>
    <p class="lock-sub">비밀번호를 입력하면 지식그래프가 열립니다.</p>
    <form id="lockForm" autocomplete="off" novalidate>
      <div class="lock-field">
        <input id="lockPw" type="password" name="pw" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password" spellcheck="false">
        <button type="button" id="lockShow" aria-label="비밀번호 보기" aria-pressed="false">보기</button>
      </div>
      <p class="lock-err" id="lockErr" role="alert" aria-live="polite"></p>
      <label class="lock-remember"><input type="checkbox" id="lockRemember"> 이 기기에서 기억하기</label>
      <button class="lock-btn" id="lockGo" type="submit">열기</button>
    </form>
    <p class="lock-foot">AES-256-GCM · PBKDF2-SHA256 <span id="lockIters">200,000</span>회</p>
  </div>
</div>

<nav class="xnav" id="appNav" aria-label="이랑 앱 바로가기">
  <div class="xnav-in">
    <a class="xnav-item" data-app="home" href="../home/"><span class="em" aria-hidden="true">🏠</span><span class="lb">홈</span></a>
    <a class="xnav-item" data-app="daily" href="../daily/"><span class="em" aria-hidden="true">📰</span><span class="lb">이랑 데일리</span></a>
    <a class="xnav-item" data-app="weekly" href="../daily/#weekly"><span class="em" aria-hidden="true">📅</span><span class="lb">위클리 이랑</span></a>
    <a class="xnav-item" data-app="mindmap" href="../"><span class="em" aria-hidden="true">🗺️</span><span class="lb">마인드맵</span></a>
    <a class="xnav-item" data-app="kg" href="./" aria-current="page"><span class="em" aria-hidden="true">🕸️</span><span class="lb">지식그래프</span></a>
  </div>
</nav>
<script>
/* 지금 보고 있는 앱을 다시 누르면 페이지를 새로 열지 않는다 */
document.getElementById('appNav').addEventListener('click', function (e) {
  if (e.target.closest('.xnav-item[aria-current="page"]')) e.preventDefault();
});
</script>

<header id="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5.4" r="2.4"/><circle cx="5.2" cy="16" r="2.2"/><circle cx="18.8" cy="16" r="2.2"/>
        <path d="M10.6 7.4 6.6 13.9M13.4 7.4l4 6.5M7.4 16h9.2"/>
      </svg>
    </span>
    <div>
      <h1 id="brandTitle">지식그래프</h1>
      <span class="stamp" id="stamp">불러오는 중</span>
    </div>
  </div>

  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="search" type="search" placeholder="검색: 이름·요약·태그" aria-label="지식그래프 검색" autocomplete="off" spellcheck="false">
    <button id="searchClear" type="button" aria-label="검색 지우기">✕</button>
  </div>

  <div id="stats" aria-label="그래프 통계">
    <span class="badge"><span class="lbl-s">노드 </span><b id="stN">0</b></span>
    <span class="badge"><span class="lbl-s">관계 </span><b id="stE">0</b></span>
    <span class="badge upd"><span class="lbl-s">업데이트 </span><b id="stU">–</b></span>
  </div>
</header>

<nav id="chips" role="group" aria-label="카테고리 필터"></nav>

<main id="stage">

    `<span id="stampUpd">업데이트 ${esc(fmtStamp(meta.updated_at))}</span>` +

  document.title = meta.title
    ? (meta.title.includes('지식그래프') ? meta.title : `${meta.title} · 지식그래프`)
    : '지식그래프';

  buildChips();
}

function buildChips() {
  const nav = $('#chips');
  const counts = { all: N.length };
  CAT_ORDER.forEach((c) => { counts[c] = 0; });
  N.forEach((n) => { counts[n.category] = (counts[n.category] || 0) + 1; });

  const items = [{ key: 'all', label: '전체', color: '#0f172a', n: counts.all }]
    .concat(CAT_ORDER.filter((c) => counts[c]).map((c) => (
      { key: c, label: CATS[c].label, color: CATS[c].color, n: counts[c] })));

  nav.innerHTML = items.map((it) => `
    <button class="chip" type="button" data-cat="${it.key}" aria-pressed="${it.key === 'all'}">
      <span class="dot" style="background:${it.color}"></span>${esc(it.label)}<span class="n">${it.n}</span>
    </button>`).join('');

  nav.querySelectorAll('.chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      filterCat = btn.dataset.cat;
      nav.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      needsDraw = true;
      const c = filterCat === 'all' ? N.length : N.filter((n) => n.category === filterCat).length;
      toast(filterCat === 'all' ? `전체 노드 ${c}개` : `${CATS[filterCat].label} ${c}개만 표시`);
      if (filterCat !== 'all') fitView(0.85);
    });
  });
}

/* ── 힘 기반 레이아웃 ─────────────────────────────── */
const ANCHOR_R = 330;
function aspect() { return isMobile() ? { x: 0.62, y: 1.52 } : { x: 1.14, y: 0.96 }; }
function tick() {
  const a = alpha;

  for (let i = 0; i < N.length; i++) {
    const p = N[i];
    for (let j = i + 1; j < N.length; j++) {
      const q = N[j];
      let dx = q.x - p.x, dy = q.y - p.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = rnd() - 0.5; dy = rnd() - 0.5; d2 = dx * dx + dy * dy; }
      if (d2 > 250000) continue;
      const d = Math.sqrt(d2);
      const minD = p.r + q.r + 14;
      let f = 3200 * a / (d2 + 60);
      if (d < minD) f += (minD - d) * 0.55 * a;
      const fx = dx / d * f, fy = dy / d * f;
      p.vx -= fx; p.vy -= fy; q.vx += fx; q.vy += fy;
    }
  }

  for (const l of L) {
    const p = l.s, q = l.t;
    const dx = q.x - p.x, dy = q.y - p.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const f = (d - l.rest) * 0.048 * a;
    const fx = dx / d * f, fy = dy / d * f;
    p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
  }

  for (const n of N) {
    n.vx -= n.x * 0.0011 * a;
    n.vy -= n.y * 0.0011 * a;
    if (n.ax !== undefined) { n.vx += (n.ax - n.x) * 0.0030 * a; n.vy += (n.ay - n.y) * 0.0030 * a; }
    n.vx *= 0.80; n.vy *= 0.80;
    const sp = Math.hypot(n.vx, n.vy);
    if (sp > 30) { n.vx = n.vx / sp * 30; n.vy = n.vy / sp * 30; }
    if (!n.fixed) { n.x += n.vx; n.y += n.vy; }
    else { n.vx = 0; n.vy = 0; }
  }
  alpha *= 0.9825;
}

function warmup(steps) {
  alpha = 1;
  for (let i = 0; i < steps && alpha > 0.02; i++) tick();
  alpha = Math.max(alpha, 0.16);
  needsDraw = true;
}

function startSim() {
  if (simOn) return;
  simOn = true;
  const loop = () => {
    if (alpha > 0.012) { tick(); needsDraw = true; }
    if (needsDraw) { draw(); needsDraw = false; }
    if (alpha > 0.012 || needsDraw) rafId = requestAnimationFrame(loop);
    else { simOn = false; draw(); }
  };
  rafId = requestAnimationFrame(loop);
}

/* ── 화면 좌표 ────────────────────────────────────── */
function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  needsDraw = true;
  draw();
}
function toScreen(x, y) { return { x: x * view.k + view.tx, y: y * view.k + view.ty }; }
function toWorld(sx, sy) { return { x: (sx - view.tx) / view.k, y: (sy - view.ty) / view.k }; }
function stageCenter() {
  const panelW = (panelOpen && !isMobile()) ? 398 : 0;
  return { x: (W - panelW) / 2, y: H / 2 };
}
function zoomAt(sx, sy, factor) {
  const k2 = clamp(view.k * factor, 0.16, 3.2);
  if (k2 === view.k) return;
  const w = toWorld(sx, sy);
  view.k = k2;
  view.tx = sx - w.x * k2;
  view.ty = sy - w.y * k2;
  needsDraw = true; updateZoomLabel(); draw();
}
function visibleNodes() {
  return N.filter((n) => filterCat === 'all' || n.category === filterCat);
}
function robustBounds(list, trim = 0.012) {
  const xs = list.map((n) => n.x).sort((a, b) => a - b);
  const ys = list.map((n) => n.y).sort((a, b) => a - b);
  const lo = Math.floor(xs.length * trim), hi = Math.max(lo, Math.ceil(xs.length * (1 - trim)) - 1);
  return { minX: xs[lo], maxX: xs[hi], minY: ys[lo], maxY: ys[hi] };
}
function fitView(pad = 0.9) {
  const list = visibleNodes();
  if (!list.length) return;
  const bb = robustBounds(list);
  const minX = bb.minX, maxX = bb.maxX, minY = bb.minY, maxY = bb.maxY;
  const bw = Math.max(60, maxX - minX), bh = Math.max(60, maxY - minY);
  const availW = W - ((panelOpen && !isMobile()) ? 398 : 0) - 56;
  const availH = H - (isMobile() ? 116 : 132);
  const k = clamp(Math.min(availW / bw, availH / bh) * pad, 0.16, 2.4);
  const c = stageCenter();
  c.y -= 10;
  view.k = k;
  view.tx = c.x - ((minX + maxX) / 2) * k;
  view.ty = c.y - ((minY + maxY) / 2) * k;
  updateZoomLabel(); needsDraw = true; draw();
}
function updateZoomLabel() { $('#zoomPct').textContent = Math.round(view.k * 100) + '%'; }

function animateView(target, ms = 320) {
  cancelAnimationFrame(animId);
  const from = { ...view }, t0 = performance.now();
  const step = (t) => {
    const p = clamp((t - t0) / ms, 0, 1);
    const e = 1 - Math.pow(1 - p, 3);
    view.k = from.k + (target.k - from.k) * e;
    view.tx = from.tx + (target.tx - from.tx) * e;
    view.ty = from.ty + (target.ty - from.ty) * e;
    updateZoomLabel(); draw();
    if (p < 1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}
function focusNode(n, zoom) {
  const c = stageCenter();
  const k = clamp(zoom || Math.max(view.k, 1.05), 0.16, 3.2);
  animateView({ k, tx: c.x - n.x * k, ty: c.y - n.y * k }, 340);
}

/* ── 그리기 ───────────────────────────────────────── */
function matches(n) {
  if (!query) return true;
  return matchSet.has(n.id);
}
function nodeVisible(n) { return filterCat === 'all' || n.category === filterCat; }

function draw() {
  if (!ctx) return;
  const k = view.k;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 은은한 점 격자
  ctx.save();
  const gap = 34 * k;
  if (gap > 16) {
    ctx.fillStyle = 'rgba(120,140,170,.10)';
    const ox = view.tx % gap, oy = view.ty % gap;
    for (let x = ox; x < W; x += gap) {
      for (let y = oy; y < H; y += gap) ctx.fillRect(x, y, 1.3, 1.3);
    }
  }
  ctx.restore();

  const focus = selected;
  const nbr = new Set();
  if (focus) {
    nbr.add(focus.id);
    for (const e of adj.get(focus.id) || []) nbr.add(e.node.id);
  }

  const baseAlpha = (n) => {
    if (!nodeVisible(n)) return 0;
    if (focus) return nbr.has(n.id) ? 1 : 0.10;
    if (query) return matches(n) ? 1 : 0.10;
    return 1;
  };

  // 엣지
  for (const l of L) {
    const a1 = baseAlpha(l.s), a2 = baseAlpha(l.t);
    if (!a1 || !a2) continue;
    const rel = focus ? (l.s === focus || l.t === focus) : false;
    const p = toScreen(l.s.x, l.s.y), q = toScreen(l.t.x, l.t.y);
    let a, w;
    if (focus) { a = rel ? 0.92 : 0.05; w = rel ? 2 : 1; }
    else if (query) { a = (matches(l.s) && matches(l.t)) ? 0.42 : 0.05; w = 1.2; }
    else { a = 0.20; w = 1; }
    ctx.strokeStyle = rel ? '#4f46e5' : 'rgba(120,140,170,' + a + ')';
    if (rel) ctx.strokeStyle = 'rgba(79,70,229,' + a + ')';
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(q.x, q.y);
    ctx.stroke();
  }

  // 노드
  const labels = [];
  for (const n of N) {
    const a = baseAlpha(n);
    if (!a) continue;
    const p = toScreen(n.x, n.y);
    const r = clamp(n.r * k, 2.6, 30);
    if (p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60) continue;
    const color = CATS[n.category].color;
    const isFocus = focus === n;
    const isNbr = focus && nbr.has(n.id) && !isFocus;
    const isMatch = query && matches(n);

    // 후광
    if (isFocus || isNbr) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + (isFocus ? 11 : 6), 0, Math.PI * 2);
      ctx.fillStyle = isFocus ? 'rgba(79,70,229,.16)' : 'rgba(79,70,229,.09)';
      ctx.fill();
    }
    if (isMatch) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 5.5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(245,158,11,.9)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = isFocus ? 2.6 : 1.6;
    ctx.strokeStyle = isFocus ? '#4f46e5' : 'rgba(255,255,255,.95)';
    ctx.stroke();

    if (n.status === '대기') {
      ctx.beginPath();
      ctx.arc(p.x + r * 0.62, p.y - r * 0.62, Math.max(2, r * 0.22), 0, Math.PI * 2);
      ctx.fillStyle = '#d97706';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const showLabel = true;
    if (showLabel) labels.push({ n, p, r, a });
  }

  // 라벨: 우선순위(포커스 > 이웃 > 검색 > 연결 많은 노드)대로 겹치지 않게 배치
  const cand = [];
  for (const it of labels) {
    const { n, r, a } = it;
    if (a < 0.4 && !(nbr.has(n.id)) && !(query && matches(n)) && hovered !== n) continue;
    let prio = n.deg * 10 + r;
    if (query && matches(n)) prio += 600;
    if (nbr.has(n.id) && focus !== n) prio += 700;
    if (hovered === n) prio += 900;
    if (focus === n) prio += 1000;
    cand.push({ ...it, prio });
  }
  cand.sort((x, y) => y.prio - x.prio);

  const maxLabels = isMobile() ? 26 : 64;
  // 노드 원을 장애물로 두고, 라벨은 아래·위·오른쪽·왼쪽 순서로 빈 자리를 찾는다
  const obstacles = [];
  for (const n of N) {
    if (!baseAlpha(n)) continue;
    const sp = toScreen(n.x, n.y);
    const rr = clamp(n.r * k, 2.6, 30);
    obstacles.push({ id: n.id, x: sp.x - rr, y: sp.y - rr, w: rr * 2, h: rr * 2 });
  }
  const taken = [];
  const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const fits = (box, ownId) => {
    if (box.x < 4 || box.y < 4 || box.x + box.w > W - 4 || box.y + box.h > H - 4) return false;
    for (const o of obstacles) if (o.id !== ownId && overlaps(box, o)) return false;
    for (const t of taken) if (overlaps(box, t)) return false;
    return true;
  };

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let drew = 0;
  for (const it of cand) {
    if (drew >= maxLabels) break;
    const { n, p, r, a, prio } = it;
    const strong = prio >= 690 || hovered === n;
    const fs = clamp((isMobile() ? 10.5 : 10) + (view.k - 0.6) * 2.4, isMobile() ? 10.5 : 9.5, 14.5);
    const maxCh = view.k < 0.95 ? 16 : 26;
    const label = n.label.length > maxCh ? n.label.slice(0, maxCh - 1) + '…' : n.label;
    ctx.font = `${strong ? 750 : 600} ${fs}px Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif`;
    const tw = ctx.measureText(label).width;
    const bh = fs + 7, bw = tw + 10, rad = Math.min(7, bh / 2);
    const gap = 4;
    const spots = [
      { x: p.x, y: p.y + r + gap + bh / 2 },
      { x: p.x, y: p.y - r - gap - bh / 2 },
      { x: p.x + r + gap + bw / 2, y: p.y },
      { x: p.x - r - gap - bw / 2, y: p.y }
    ];
    let chosen = null;
    for (const sp of spots) {
      const box = { x: sp.x - bw / 2, y: sp.y - bh / 2, w: bw, h: bh };
      if (fits(box, n.id)) { chosen = { sp, box }; break; }
    }
    if (!chosen) continue;
    taken.push(chosen.box);
    drew++;
    const { sp } = chosen;
    ctx.globalAlpha = a * (strong ? 0.99 : 0.9);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(sp.x - bw / 2, sp.y - bh / 2, bw, bh, rad);
    else ctx.rect(sp.x - bw / 2, sp.y - bh / 2, bw, bh);
    ctx.fillStyle = strong ? 'rgba(255,255,255,.98)' : 'rgba(255,255,255,.96)';
    ctx.fill();
    ctx.strokeStyle = strong ? 'rgba(79,70,229,.5)' : 'rgba(100,116,139,.42)';
    ctx.lineWidth = strong ? 1.3 : 1;
    ctx.stroke();
    ctx.globalAlpha = a;
    ctx.fillStyle = strong ? '#312e81' : '#334155';
    ctx.fillText(label, sp.x, sp.y);
    ctx.globalAlpha = 1;
  }
}

/* ── 선택·패널 ────────────────────────────────────── */
function neighborDegree(id) { return (adj.get(id) || []).length; }

function selectNode(n, opts = {}) {
  selected = n;
  renderPanel(n);
  openPanel();
  needsDraw = true; draw();
  if (opts.focus) focusNode(n, opts.zoom);
}

function openPanel() {
  panelOpen = true;
  $('#panel').classList.add('open');
  $('#panel').setAttribute('aria-hidden', 'false');
  if (isMobile()) {
    document.body.classList.add('sheet');
    $('#scrim').classList.add('on');
  }
  if (stage) stage.scrollTop = 0;
  needsDraw = true; draw();
}
function closePanel() {
  panelOpen = false;
  $('#panel').classList.remove('open');
  $('#panel').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('sheet');
  $('#scrim').classList.remove('on');
  if (stage) stage.scrollTop = 0;
  selected = null;
  needsDraw = true; draw();
}

function renderPanel(n) {
  const cat = CATS[n.category];
  const stColor = STATUS[n.status] || '#64748b';
  const pc = $('#pCat');
  pc.textContent = cat.label;
  pc.style.background = cat.color;
  const ps = $('#pStatus');
  ps.textContent = n.status;
  ps.style.color = stColor;
  ps.style.borderColor = stColor + '55';

  $('#pTitle').textContent = n.label;

  const rels = adj.get(n.id) || [];
  const outs = rels.filter((r) => r.dir === 'out').length;
  const ins = rels.length - outs;
  $('#pMeta').innerHTML = [
    n.date ? `<span>${esc(fmtDate(n.date))}</span>` : '',
    `<span>연결 ${rels.length}개${rels.length ? ` (나감 ${outs} · 들어옴 ${ins})` : ''}</span>`,
    `<span>${esc(n.id)}</span>`
  ].filter(Boolean).join('');

  $('#pSummary').textContent = n.summary || '요약이 없습니다.';

  $('#pTags').innerHTML = (n.tags || []).map((t) => `<span class="tag">#${esc(t)}</span>`).join('');

  const lw = $('#pLinkWrap');
  if (n.url) {
    lw.innerHTML = `<a id="pLink" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.2-1.2"/></svg>
      <span>${esc(n.url.replace(/^https?:\/\//, ''))}</span></a>`;
  } else lw.innerHTML = '';

  const groups = new Map();
  for (const r of rels) {
    if (!groups.has(r.relation)) groups.set(r.relation, []);
    groups.get(r.relation).push(r);
  }
  const order = ['소속', '추진', '산출', '배포', '참여', '일정', '위치', '포함', '연계', '후속'];
  const keys = Array.from(groups.keys()).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const html = keys.map((rel) => {
    const items = groups.get(rel).slice().sort((x, y) => y.node.deg - x.node.deg);
    return `<div class="rel-group">
      <div class="rel-head"><span class="rel-name" style="background:${REL_COLOR[rel] || '#94a3b8'}">${esc(rel)}</span>
        <span class="rel-cnt">${items.length}</span></div>
      ${items.map((it) => `<button class="rel-item" type="button" data-go="${esc(it.node.id)}">
        <span class="lbl"><span class="d" style="background:${CATS[it.node.category].color}"></span>${esc(it.node.label)}</span>
        ${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}
      </button>`).join('')}
    </div>`;
  }).join('');

  const box = $('#pRels');
  box.innerHTML = html || '<p class="empty">연결된 노드가 없습니다.</p>';
  box.querySelectorAll('[data-go]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const t = byId.get(btn.dataset.go);
      if (t) selectNode(t, { focus: true, zoom: Math.max(view.k, 1.0) });
    });
  });
}

/* ── 검색 ─────────────────────────────────────────── */
function runSearch(q) {
  query = q.trim().toLowerCase();
  matchSet = new Set();
  if (query) {
    const parts = query.split(/\s+/).filter(Boolean);
    for (const n of N) {
      const hay = [n.label, n.summary, n.status, CATS[n.category].label, (n.tags || []).join(' ')]
        .join(' ').toLowerCase();
      if (parts.every((p) => hay.includes(p))) matchSet.add(n.id);
    }
    if (!matchSet.size) toast('일치하는 노드가 없습니다');
  }
  const clr = $('#searchClear');
  clr.classList.toggle('on', !!q.trim());
  needsDraw = true; draw();
}

/* ── 포인터 ───────────────────────────────────────── */
const pointers = new Map();
let dragNode = null, panning = false, moved = 0, last = null;

function localPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function hitTest(sx, sy) {
  let best = null, bestD = Infinity;
  for (const n of N) {
    if (!nodeVisible(n)) continue;
    if (query && !matches(n)) continue;
    const p = toScreen(n.x, n.y);
    const r = clamp(n.r * view.k, 3, 30) + 7;
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d <= r && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

function onPointerDown(e) {
  if (document.body.classList.contains('locked')) return;
  canvas.setPointerCapture(e.pointerId);
  const p = localPoint(e);
  pointers.set(e.pointerId, p);
  moved = 0; last = p;

  if (pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    pinching = { d: Math.hypot(a.x - b.x, a.y - b.y), mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
    dragNode = null; panning = false;
    return;
  }

  const n = hitTest(p.x, p.y);
  if (n) {
    dragNode = n; n.fixed = true;
    canvas.classList.add('grabbing');
  } else {
    panning = true;
    canvas.classList.add('grabbing');
  }
}

function onPointerMove(e) {
  const p = localPoint(e);

  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);

  if (pointers.size === 2 && pinching) {
    const [a, b] = Array.from(pointers.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinching.d > 4) {
      const f = d / pinching.d;
      const w = toWorld(pinching.mid.x, pinching.mid.y);
      view.k = clamp(view.k * f, 0.16, 3.2);
      view.tx = mid.x - w.x * view.k;
      view.ty = mid.y - w.y * view.k;
      updateZoomLabel();
    }
    view.tx += mid.x - pinching.mid.x;
    view.ty += mid.y - pinching.mid.y;
    pinching = { d, mid };
    needsDraw = true; draw();
    return;
  }

  if (dragNode) {
    const w = toWorld(p.x, p.y);
    dragNode.x = w.x; dragNode.y = w.y;
    moved += Math.hypot(p.x - last.x, p.y - last.y);
    last = p;
    alpha = Math.max(alpha, 0.22);
    needsDraw = true;
    if (!simOn) startSim();
    return;
  }

  if (panning) {
    view.tx += p.x - last.x;
    view.ty += p.y - last.y;
    moved += Math.hypot(p.x - last.x, p.y - last.y);
    last = p;
    needsDraw = true; draw();
    return;
  }

  // 호버
  const n = hitTest(p.x, p.y);
  if (n !== hovered) {
    hovered = n;
    canvas.classList.toggle('onnode', !!n);
    const tip = $('#tooltip');
    if (n) {
      tip.textContent = n.label;
      tip.style.left = p.x + 'px';
      tip.style.top = p.y + 'px';
      tip.classList.add('on');
    } else tip.classList.remove('on');
    needsDraw = true; draw();
  } else if (n) {
    const tip = $('#tooltip');
    tip.style.left = p.x + 'px';
    tip.style.top = p.y + 'px';
  }
}

function onPointerUp(e) {
  const p = pointers.get(e.pointerId) || localPoint(e);
  pointers.delete(e.pointerId);

  if (pinching) {
    if (pointers.size < 2) pinching = null;
    if (!pointers.size) { dragNode = null; panning = false; canvas.classList.remove('grabbing'); }
    return;
  }

  if (dragNode) {
    const n = dragNode;
    const wasClick = moved < 5;
    dragNode = null;
    canvas.classList.remove('grabbing');
    if (wasClick) { n.fixed = false; selectNode(n); }
    else {
      // 놓은 자리에 잠깐 붙잡아 두었다가 천천히 제자리로 돌려보낸다
      setTimeout(() => {
        if (n.fixed) { n.fixed = false; alpha = Math.max(alpha, 0.16); startSim(); }
      }, 1400);
      alpha = Math.max(alpha, 0.18); startSim();
    }
    return;
  }
  if (panning) {
    panning = false;
    canvas.classList.remove('grabbing');
    if (moved < 5) { if (selected) closePanel(); }
  }
}

function onWheel(e) {
  e.preventDefault();
  const p = localPoint(e);
  const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016));
  zoomAt(p.x, p.y, f);
}

function relayout() {
  _seed = 20261127;
  for (const n of N) { n.fixed = false; n.vx = 0; n.vy = 0; }
  const byCat = {};
  for (const n of N) (byCat[n.category] = byCat[n.category] || []).push(n);
  const R = 90 + Math.sqrt(N.length) * 34;
  CAT_ORDER.forEach((cat, ci) => {
    const g = byCat[cat] || [];
    const base = (ci / CAT_ORDER.length) * Math.PI * 2 - Math.PI / 2;
    const spread = (Math.PI * 2 / CAT_ORDER.length) * 0.86;
    g.forEach((n, i) => {
      const a = base + (g.length > 1 ? (i / (g.length - 1) - 0.5) * spread : 0);
      const rr = R * (0.52 + 0.48 * ((i % 5) / 4)) * (0.85 + rnd() * 0.3);
      const AS = aspect();
      n.x = Math.cos(a) * rr * AS.x + (rnd() - 0.5) * 20;
      n.y = Math.sin(a) * rr * AS.y + (rnd() - 0.5) * 20;
      n.ax = Math.cos(base) * ANCHOR_R * AS.x + (rnd() - 0.5) * 90;
      n.ay = Math.sin(base) * ANCHOR_R * AS.y + (rnd() - 0.5) * 80;
      n.vx = 0; n.vy = 0;
    });
  });
  warmup(260);
  startSim();
  fitView();
  toast('레이아웃을 다시 배치했습니다');
}

/* ── 잠금 (AES-256-GCM / PBKDF2-SHA256, Web Crypto) ── */
const LS_REMEMBER = 'kg_unlock_v1';
const SS_UNLOCK = 'kg_session_v1';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes) {
  const a = new Uint8Array(bytes);
  let s = '';
  for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
  return btoa(s);
}
function lockAad() { return LOCK && LOCK.aad ? new TextEncoder().encode(LOCK.aad) : undefined; }
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(LOCK.kdf.salt), iterations: LOCK.kdf.iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
  );
}
async function decryptWith(key) {
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(LOCK.iv), additionalData: lockAad() },
    key, b64ToBytes(LOCK.ct)
  );
  return JSON.parse(new TextDecoder().decode(pt));
}
async function decryptWithRawKey(b64) {
  const key = await crypto.subtle.importKey('raw', b64ToBytes(b64), { name: 'AES-GCM' }, true, ['decrypt']);
  return decryptWith(key);
}
function savedUnlockKey() {
  for (const raw of [ssGet(SS_UNLOCK), lsGet(LS_REMEMBER)]) {
    if (!raw) continue;
    try {
      const o = JSON.parse(raw);
      if (o && o.k && o.fp === LOCK.fp) return o.k;
    } catch (e) {}
  }
  return null;
}
function showLockError(msg) {
  const err = $('#lockErr');
  if (err) err.textContent = msg || '';
  const card = $('.lock-card');
  if (card && msg) { card.classList.remove('lock-shake'); void card.offsetWidth; card.classList.add('lock-shake'); }
}
async function lockGate() {
  document.body.classList.add('locked');
  $('#lockIters').textContent = Number(LOCK.kdf.iterations).toLocaleString('en-US');
  const pw = $('#lockPw'), go = $('#lockGo'), form = $('#lockForm'), remember = $('#lockRemember');
  $('#lockShow').addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    $('#lockShow').textContent = show ? '숨기기' : '보기';
    $('#lockShow').setAttribute('aria-pressed', String(show));
    pw.focus();
  });
  try { pw.focus(); } catch (e) {}

  const saved = savedUnlockKey();
  if (saved) {
    try {
      const data = await decryptWithRawKey(saved);
      document.body.classList.remove('locked');
      return data;
    } catch (e) { ssDel(SS_UNLOCK); lsDel(LS_REMEMBER); }
  }

  return new Promise((resolve) => {
    let fails = 0;
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const value = pw.value;
      if (!value) { showLockError('비밀번호를 입력해 주세요.'); pw.focus(); return; }
      go.disabled = true; go.textContent = '여는 중…'; showLockError('');
      try {
        const key = await deriveKey(value);
        const data = await decryptWith(key);
        try {
          const raw = bytesToB64(await crypto.subtle.exportKey('raw', key));
          const rec = JSON.stringify({ v: 1, fp: LOCK.fp, k: raw });
          ssSet(SS_UNLOCK, rec);
          if (remember.checked) lsSet(LS_REMEMBER, rec); else lsDel(LS_REMEMBER);
        } catch (e) {}
        document.body.classList.remove('locked');
        $('#lock').setAttribute('aria-hidden', 'true');
        resolve(data);
      } catch (e) {
        fails++;
        showLockError('비밀번호가 맞지 않습니다. 다시 확인해 주세요.');
        pw.select();
        go.disabled = false; go.textContent = '열기';
        await new Promise((r) => setTimeout(r, Math.min(1500, 250 * fails)));
      }
    });
  });
}

/* ── 시작 ─────────────────────────────────────────── */
function readInline() {
  const el = document.getElementById('kg-data');
  if (!el) return null;
  const t = el.textContent.trim();
  if (!t) return null;
  try { const d = JSON.parse(t); return (d && d.nodes && d.nodes.length) ? d : null; }
  catch (e) { return null; }
}

async function boot() {
  canvas = $('#cv'); ctx = canvas.getContext('2d'); stage = $('#stage');

  if (LOCK) {
    const data = await lockGate();
    DATA = data;
  } else {
    DATA = readInline();
    if (!DATA) {
      toast('그래프 데이터를 읽지 못했습니다. 잠금 빌드인지 확인해 주세요.', 6000);
      return;
    }
  }

  buildModel(DATA);
  resize();
  warmup(320);
  if (isMobile()) {
    for (const n of N) { n.x *= 0.74; n.ax *= 0.74; n.vx = 0; n.vy = 0; }
    alpha = Math.max(alpha, 0.22);
    for (let i = 0; i < 60; i++) tick();
  }
  startSim();
  fitView();

  new ResizeObserver(() => { resize(); }).observe(stage);

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', (e) => {
    if (!pointers.size) { hovered = null; canvas.classList.remove('onnode'); $('#tooltip').classList.remove('on'); needsDraw = true; draw(); }
  });
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('dblclick', () => fitView());
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  $('#zIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.28));
  $('#zOut').addEventListener('click', () => zoomAt(W / 2, H / 2, 1 / 1.28));
  $('#zFit').addEventListener('click', () => fitView());
  $('#zReset').addEventListener('click', relayout);
  $('#pClose').addEventListener('click', closePanel);
  $('#scrim').addEventListener('click', closePanel);

  const sp = $('#search');
  let sTimer = 0;
  sp.addEventListener('input', () => {
    clearTimeout(sTimer);
    sTimer = setTimeout(() => runSearch(sp.value), 110);
  });
  sp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = N.find((n) => matchSet.has(n.id));
      if (first) { selectNode(first, { focus: true, zoom: 1.25 }); }
    }
    if (e.key === 'Escape') { sp.value = ''; runSearch(''); }
  });
  $('#searchClear').addEventListener('click', () => { sp.value = ''; runSearch(''); sp.focus(); });

  document.addEventListener('keydown', (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'Escape') { if (selected) closePanel(); }
    else if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.25);
    else if (e.key === '-') zoomAt(W / 2, H / 2, 1 / 1.25);
    else if (e.key === 'f' || e.key === 'F') fitView();
    else if (e.key === 'r' || e.key === 'R') relayout();
  });

  const hideHint = () => { $('#hint').classList.add('off'); };
  setTimeout(hideHint, 7000);
  canvas.addEventListener('pointerdown', hideHint, { once: true });

  // 화면 밖에서 상태를 확인할 수 있는 최소 핸들 (검증·디버깅용)
  window.kg = {
    state: () => ({
      nodes: N.length, links: L.length, filter: filterCat, query,
      matches: matchSet.size, selected: selected && selected.id,
      k: +view.k.toFixed(3), alpha: +alpha.toFixed(3),
      locked: document.body.classList.contains('locked')
    }),
    ids: () => N.map((n) => n.id),
    pos: (id) => {
      const n = byId.get(id); if (!n) return null;
      const p = toScreen(n.x, n.y);
      return { x: p.x, y: p.y, r: clamp(n.r * view.k, 3, 30) };
    },
    select: (id) => { const n = byId.get(id); if (n) { selectNode(n, { focus: true }); return true; } return false; }
  };
}

boot();
</script>
